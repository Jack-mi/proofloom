# Supply absolute host paths through the two required parameters. No home mount.
minimumLimaVersion: 2.3.0
vmType: vz
arch: aarch64
cpus: 4
memory: 6GiB
disk: 60GiB
mountType: virtiofs
param:
  repository: null
  work: null
images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release-20261017/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:50e24e1fb79e89116e939d90aa7738f7af48c442fa1bc2510131e0b39c50348e
mounts:
  - location: "{{.Param.repository}}"
    mountPoint: /proofloom
    writable: false
  - location: "{{.Param.work}}"
    mountPoint: /proofloom-work
    writable: true
ssh:
  loadDotSSHPubKeys: false
containerd:
  system: false
  user: false
propagateProxyEnv: false
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      apt-get update -qq
      DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
        ca-certificates curl git zstd bubblewrap make gcc g++ python3 time
      # Scope Ubuntu's user-namespace exception to the bubblewrap executable.
      if command -v apparmor_parser >/dev/null 2>&1; then
        cat > /etc/apparmor.d/proofloom-bwrap <<'PROFILE'
      abi <abi/4.0>,
      include <tunables/global>
      profile proofloom-bwrap /usr/bin/bwrap flags=(unconfined) {
        userns,
      }
      PROFILE
        apparmor_parser -r /etc/apparmor.d/proofloom-bwrap
      fi
