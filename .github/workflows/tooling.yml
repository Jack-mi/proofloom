name: Offline tooling
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tooling:
    # Python 3.9 builds are available for this LTS image, unlike Ubuntu 26.04.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 tools/validate_tooling.py
